<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1739"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360M1100 0V360"/>
  </g>

  <!-- left: title -->
  <text x="60" y="78" fill="#fbbf24" font-size="15" font-weight="700" letter-spacing="2.5">AAAI 2026 BRIDGE · LOGIC &amp; SYMBOLIC REASONING</text>
  <text x="60" y="140" fill="#ffffff" font-size="46" font-weight="800">Consistent Biases in LLMs’</text>
  <text x="60" y="194" fill="#ffffff" font-size="46" font-weight="800">Syllogistic Reasoning</text>
  <text x="60" y="240" fill="#c7d2fe" font-size="19">44 syllogistic forms · 11,000 WordNet items · 5 frontier LLMs</text>
  <g font-size="15" font-weight="600">
    <rect x="60" y="272" width="160" height="36" rx="18" fill="#fbbf24"/>
    <text x="140" y="296" fill="#0b1739" text-anchor="middle">mean r = 0.886</text>
    <rect x="232" y="272" width="196" height="36" rx="18" fill="none" stroke="#c7d2fe" stroke-opacity="0.6"/>
    <text x="330" y="296" fill="#e0e7ff" text-anchor="middle">valid 93% · invalid 56%</text>
    <rect x="440" y="272" width="178" height="36" rx="18" fill="none" stroke="#c7d2fe" stroke-opacity="0.6"/>
    <text x="529" y="296" fill="#e0e7ff" text-anchor="middle">middle-term bias</text>
  </g>

  <!-- right: syllogism card -->
  <rect x="740" y="52" width="400" height="256" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="768" y="88" fill="#a5b4fc" font-size="13" font-weight="700" letter-spacing="2">INVALID FORM · IAI-1</text>
  <g font-size="19" fill="#ffffff">
    <text x="768" y="130">Some animals are mammals.</text>
    <text x="768" y="164">All dogs are animals.</text>
  </g>
  <line x1="768" y1="184" x2="1112" y2="184" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="768" y="218" fill="#ffffff" font-size="19">∴ Some dogs are mammals.</text>
  <g font-size="15" font-weight="700">
    <rect x="768" y="244" width="150" height="38" rx="10" fill="#10b981" fill-opacity="0.18" stroke="#34d399"/>
    <text x="843" y="269" fill="#6ee7b7" text-anchor="middle">Logic: No ✗</text>
    <rect x="930" y="244" width="182" height="38" rx="10" fill="#f59e0b" fill-opacity="0.18" stroke="#fbbf24"/>
    <text x="1021" y="269" fill="#fde68a" text-anchor="middle">LLMs: 92.5% “Yes”</text>
  </g>
</svg>
